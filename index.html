<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F5F2EC; --surface:#FFFFFF; --ink:#1A1A18; --ink-muted:#6B6B62; --accent:#2D5A3D; --accent-light:#E8F0EA; --border:#DDD9D0; --error:#C0392B; --score-high:#2D5A3D; --score-mid:#7A6A2D; --score-low:#8B4A2D; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { padding:1.5rem 3rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--bg); }
  .logo { display:flex; align-items:baseline; gap:.75rem; }
  .logo h1 { font-family:'DM Serif Display',serif; font-size:1.4rem; letter-spacing:-.02em; }
  .logo span { font-family:'DM Mono',monospace; font-size:.65rem; color:var(--ink-muted); letter-spacing:.1em; text-transform:uppercase; }
  nav { display:flex; }
  .tab-btn { padding:.5rem 1.25rem; font-family:'DM Mono',monospace; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; border:1.5px solid var(--border); background:none; cursor:pointer; color:var(--ink-muted); transition:all .15s; }
  .tab-btn:first-child { border-radius:4px 0 0 4px; }
  .tab-btn:last-child { border-radius:0 4px 4px 0; border-left:none; }
  .tab-btn.active { background:var(--accent); border-color:var(--accent); color:white; }
  .container { max-width:680px; margin:0 auto; padding:3rem 2rem; }
  .panel { display:none; } .panel.active { display:block; }
  .form-title { margin-bottom:2rem; }
  .form-title h2 { font-family:'DM Serif Display',serif; font-size:1.75rem; letter-spacing:-.03em; margin-bottom:.25rem; }
  .form-title p { font-size:.875rem; color:var(--ink-muted); }
  .field { margin-bottom:1.5rem; }
  .field label { display:block; font-family:'DM Mono',monospace; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.5rem; }
  .field label .req { color:var(--accent); margin-left:2px; }
  .field label .opt { font-size:.6rem; color:var(--ink-muted); text-transform:none; letter-spacing:0; }
  .field input,.field select { width:100%; padding:.8rem 1rem; font-family:'DM Sans',sans-serif; font-size:.95rem; border:1.5px solid var(--border); background:var(--surface); border-radius:4px; outline:none; color:var(--ink); transition:border-color .2s; appearance:none; -webkit-appearance:none; }
  .field input:focus,.field select:focus { border-color:var(--accent); }
  .field input::placeholder { color:#BBBBAA; }
  .field input.error,.field select.error { border-color:var(--error); background:#FDF5F5; }
  .select-wrap { position:relative; }
  .select-wrap::after { content:'▾'; position:absolute; right:1rem; top:50%; transform:translateY(-50%); color:var(--ink-muted); pointer-events:none; }
  .toggle-group { display:flex; gap:.5rem; flex-wrap:wrap; }
  .toggle-btn { padding:.5rem 1.1rem; font-family:'DM Mono',monospace; font-size:.75rem; letter-spacing:.05em; border:1.5px solid var(--border); background:var(--surface); border-radius:4px; cursor:pointer; color:var(--ink-muted); transition:all .15s; }
  .toggle-btn:hover { border-color:var(--accent); color:var(--accent); }
  .toggle-btn.selected { background:var(--accent); border-color:var(--accent); color:white; }
  .toggle-group.error .toggle-btn { border-color:var(--error); }
  .input-suffix { position:relative; }
  .input-suffix input { padding-right:2.5rem; }
  .input-suffix .suffix { position:absolute; right:1rem; top:50%; transform:translateY(-50%); font-family:'DM Mono',monospace; font-size:.75rem; color:var(--ink-muted); pointer-events:none; }
  .submit-btn { width:100%; padding:1rem; background:var(--accent); color:white; border:none; border-radius:4px; font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:500; cursor:pointer; transition:background .2s; margin-top:.5rem; }
  .submit-btn:hover { background:#224530; }
  .submit-btn:disabled { background:var(--border); cursor:not-allowed; }
  .form-msg { margin-top:1rem; padding:.875rem 1rem; border-radius:4px; font-size:.875rem; display:none; }
  .form-msg.success { background:var(--accent-light); color:var(--accent); border:1px solid #C0D9C6; display:block; }
  .form-msg.error { background:#FDF0EE; color:#8B3A2D; border:1px solid #E8C4BC; display:block; }
  .search-section { margin-bottom:2.5rem; }
  .search-label { font-family:'DM Mono',monospace; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.5rem; display:block; }
  .search-row { display:flex; gap:.75rem; }
  .search-input { flex:1; padding:.8rem 1rem; font-family:'DM Sans',sans-serif; font-size:.95rem; border:1.5px solid var(--border); background:var(--surface); border-radius:4px; outline:none; color:var(--ink); transition:border-color .2s; }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:#BBBBAA; }
  .search-btn { padding:.8rem 1.5rem; background:var(--accent); color:white; border:none; border-radius:4px; font-family:'DM Sans',sans-serif; font-size:.9rem; font-weight:500; cursor:pointer; }
  .search-btn:hover { background:#224530; }
  .results-area { display:none; } .results-area.visible { display:block; }
  .company-heading { margin-bottom:1.75rem; }
  .company-heading .label { font-family:'DM Mono',monospace; font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.2rem; }
  .company-heading h2 { font-family:'DM Serif Display',serif; font-size:1.75rem; letter-spacing:-.03em; }
  .company-heading .submitted-date { font-size:.75rem; color:var(--ink-muted); margin-top:.25rem; }
  .recommendation { background:var(--accent-light); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:1.25rem 1.5rem; margin-bottom:2rem; }
  .rec-tag { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:.6rem; }
  .rec-text { font-size:.875rem; line-height:1.7; }
  .matches-label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.75rem; }
  .match-card { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:1.25rem 1.5rem; margin-bottom:.625rem; }
  .match-card-top { display:grid; grid-template-columns:2rem 1fr auto; gap:1rem; align-items:center; }
  .rank { font-family:'DM Serif Display',serif; font-size:1.75rem; color:var(--border); line-height:1; text-align:center; }
  .match-supplier { font-size:.95rem; font-weight:500; margin-bottom:.2rem; }
  .match-meta { font-size:.775rem; color:var(--ink-muted); display:flex; gap:1rem; flex-wrap:wrap; }
  .score-number { font-family:'DM Mono',monospace; font-size:1.4rem; font-weight:500; line-height:1; text-align:center; }
  .score-number.high { color:var(--score-high); } .score-number.mid { color:var(--score-mid); } .score-number.low { color:var(--score-low); }
  .score-lbl { font-family:'DM Mono',monospace; font-size:.5rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); text-align:center; margin-top:.15rem; }
  .card-footer { margin-top:.875rem; padding-top:.875rem; border-top:.5px solid var(--border); }
  .more-btn { font-size:.8rem; color:var(--ink-muted); background:none; border:1px solid var(--border); border-radius:4px; padding:.3rem .875rem; cursor:pointer; transition:all .15s; }
  .more-btn:hover,.more-btn.open { color:var(--accent); border-color:var(--accent); }
  .expand-panel { display:none; margin-top:.875rem; }
  .expand-panel.open { display:block; }
  .expand-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .expand-tile { background:var(--bg); border-radius:4px; padding:.625rem .75rem; }
  .expand-tile-label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.25rem; }
  .expand-tile-value { font-size:.875rem; font-weight:500; }
  .show-more-row { text-align:center; margin-top:.75rem; }
  .show-more-btn { background:none; border:1.5px solid var(--border); border-radius:4px; padding:.5rem 1.25rem; font-family:'DM Sans',sans-serif; font-size:.8rem; color:var(--ink-muted); cursor:pointer; }
  .show-more-btn:hover { border-color:var(--accent); color:var(--accent); }
  .hidden-cards { display:none; }
  .state-msg { text-align:center; padding:3rem 2rem; color:var(--ink-muted); font-size:.875rem; }
  .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto .75rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>Procurement Buddy</h1>
    <span>Material matching platform</span>
  </div>
  <nav>
    <button class="tab-btn active" id="tab-form">Submit Request</button>
    <button class="tab-btn" id="tab-results">View Matches</button>
  </nav>
</header>

<div class="container">
  <div class="panel active" id="panel-form">
    <div class="form-title">
      <h2>Submit Material Request</h2>
      <p>Fill in your requirements and we'll find the best matches for you.</p>
    </div>
    <div class="field">
      <label>Company name <span class="req">*</span></label>
      <input type="text" id="f-company" placeholder="Your company name" />
    </div>
    <div class="field">
      <label>Company city <span class="req">*</span></label>
      <input type="text" id="f-city" placeholder="Your city" />
    </div>
    <div class="field">
      <label>Material type needed <span class="req">*</span></label>
      <div class="toggle-group" id="material-type-group">
        <button type="button" class="toggle-btn" id="btn-HDPE">HDPE</button>
        <button type="button" class="toggle-btn" id="btn-LDPE">LDPE</button>
        <button type="button" class="toggle-btn" id="btn-PP">PP</button>
        <button type="button" class="toggle-btn" id="btn-PET">PET</button>
      </div>
    </div>
    <div class="field">
      <label>Color <span class="req">*</span></label>
      <div class="select-wrap">
        <select id="f-color">
          <option value="">Select color</option>
          <option>Any color</option>
          <option>Black</option>
          <option>Blue</option>
          <option>Brown</option>
          <option>Green</option>
          <option>Mixed colors</option>
          <option>Natural</option>
          <option>Red</option>
          <option>Transparent</option>
          <option>White</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Max contamination degree <span class="req">*</span> <span class="opt">&nbsp;numbers only, e.g. 5 for 5%</span></label>
      <div class="input-suffix">
        <input type="number" id="f-contamination" placeholder="e.g. 5" min="0" max="100" step="0.1" />
        <span class="suffix">%</span>
      </div>
    </div>
    <div class="field">
      <label>Volume needed <span class="opt">(optional)</span></label>
      <div class="input-suffix">
        <input type="number" id="f-volume" placeholder="e.g. 10" min="0" step="0.1" />
        <span class="suffix">tons</span>
      </div>
    </div>
    <div class="field">
      <label>When do you need the material? <span class="req">*</span></label>
      <input type="date" id="f-date" />
    </div>
    <button type="button" class="submit-btn" id="submit-btn">Submit Request</button>
    <div class="form-msg" id="form-msg"></div>
  </div>

  <div class="panel" id="panel-results">
    <div class="search-section">
      <span class="search-label">Find your matches</span>
      <div class="search-row">
        <input type="text" class="search-input" id="companyInput" placeholder="Enter your company name..." />
        <button type="button" class="search-btn" id="search-btn">Search</button>
      </div>
    </div>
    <div class="results-area" id="results-area"></div>
  </div>
</div>

<script>
var SHEET_ID = '18bXTklgzemt95IyI1npV40RD0bX7KfoCbXSMZsrnp3o';
var API_KEY = 'AIzaSyA8Ec5isrJ6SQIcRCU4J0Dqk8Wu1pXYYq0';
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxscW8RY2Ovi4XU0YidKBp2cFk-2xVlxbtY2cERq__EHp31DB4bS2tTY-DqTM8PFkOC/exec';
var selectedMaterial = '';

function showTab(tab) {
  ['form','results'].forEach(function(t) {
    document.getElementById('panel-'+t).classList.remove('active');
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('panel-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

document.getElementById('tab-form').addEventListener('click', function() { showTab('form'); });
document.getElementById('tab-results').addEventListener('click', function() { showTab('results'); });

['HDPE','LDPE','PP','PET'].forEach(function(mat) {
  document.getElementById('btn-'+mat).addEventListener('click', function() {
    ['HDPE','LDPE','PP','PET'].forEach(function(m) { document.getElementById('btn-'+m).classList.remove('selected'); });
    document.getElementById('btn-'+mat).classList.add('selected');
    selectedMaterial = mat;
    document.getElementById('material-type-group').classList.remove('error');
  });
});

document.getElementById('submit-btn').addEventListener('click', function() {
  var company = document.getElementById('f-company').value.trim();
  var city = document.getElementById('f-city').value.trim();
  var color = document.getElementById('f-color').value;
  var contamination = document.getElementById('f-contamination').value;
  var volume = document.getElementById('f-volume').value;
  var date = document.getElementById('f-date').value;

  ['f-company','f-city','f-color','f-contamination','f-date'].forEach(function(id) { document.getElementById(id).classList.remove('error'); });
  document.getElementById('material-type-group').classList.remove('error');
  document.getElementById('form-msg').className = 'form-msg';

  var valid = true;
  if (!company) { document.getElementById('f-company').classList.add('error'); valid = false; }
  if (!city) { document.getElementById('f-city').classList.add('error'); valid = false; }
  if (!selectedMaterial) { document.getElementById('material-type-group').classList.add('error'); valid = false; }
  if (!color) { document.getElementById('f-color').classList.add('error'); valid = false; }
  if (!contamination || isNaN(parseFloat(contamination))) { document.getElementById('f-contamination').classList.add('error'); valid = false; }
  if (!date) { document.getElementById('f-date').classList.add('error'); valid = false; }

  if (!valid) {
    var m = document.getElementById('form-msg');
    m.textContent = 'Please fill in all required fields.';
    m.className = 'form-msg error';
    return;
  }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var requestId = 'REQ-' + Date.now();
  var submittedCompany = company;
  var submittedDate = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});

  var payload = {
    Request_ID: requestId, Customer_Name: company, Location_City: city,
    Material_Type_Needed: selectedMaterial, Color: color,
    Max_Contamination_Degree: parseFloat(contamination) / 100,
    Quantity_Tons: volume ? parseFloat(volume) : '',
    Date_Delivery: date, Created_Date: new Date().toISOString().split('T')[0],
    Material_Form_Needed: '', Material_Origin: '', Quality_Grade_Requirements: '',
    Maximum_Price_Per_Ton: '', Location_Country: '', Urgency: '', Status: 'New',
    Contact_Person_Name: '', Contact_Email: '', Notes: ''
  };

  var iframe = document.getElementById('hidden-iframe');
  if (!iframe) {
    iframe = document.createElement('iframe');
    iframe.name = 'hidden-iframe'; iframe.id = 'hidden-iframe'; iframe.style.display = 'none';
    document.body.appendChild(iframe);
  }
  var form = document.createElement('form');
  form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hidden-iframe';
  var inp = document.createElement('input');
  inp.type = 'hidden'; inp.name = 'data'; inp.value = JSON.stringify(payload);
  form.appendChild(inp); document.body.appendChild(form); form.submit(); document.body.removeChild(form);

  document.getElementById('f-company').value = '';
  document.getElementById('f-city').value = '';
  document.getElementById('f-color').value = '';
  document.getElementById('f-contamination').value = '';
  document.getElementById('f-volume').value = '';
  document.getElementById('f-date').value = '';
  ['HDPE','LDPE','PP','PET'].forEach(function(m) { document.getElementById('btn-'+m).classList.remove('selected'); });
  selectedMaterial = '';
  btn.disabled = false; btn.textContent = 'Submit Request';

  var msg = document.getElementById('form-msg');
  msg.textContent = 'Request submitted! Switching to results...';
  msg.className = 'form-msg success';

  setTimeout(function() {
    showTab('results');
    document.getElementById('companyInput').value = submittedCompany;
    var area = document.getElementById('results-area');
    area.className = 'results-area visible';
    area.innerHTML = '<div class="state-msg"><div class="spinner"></div><p>Processing your request... this takes around 30 seconds.</p><p style="margin-top:.5rem;font-size:.75rem;color:var(--ink-muted)">Request submitted on ' + submittedDate + '</p></div>';
    setTimeout(function() { searchMatches(submittedDate); }, 35000);
  }, 1000);
});

document.getElementById('search-btn').addEventListener('click', function() { searchMatches(null); });
document.getElementById('companyInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') searchMatches(null); });

async function fetchSheet(name) {
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID + '/values/' + encodeURIComponent(name) + '?key=' + API_KEY;
  var res = await fetch(url);
  if (!res.ok) throw new Error('Failed to fetch ' + name);
  var data = await res.json();
  var headers = data.values[0];
  return data.values.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i] || ''; });
    return obj;
  });
}

function fmtContam(val) {
  if (!val) return 'N/A';
  var n = parseFloat(val.toString().replace('%','').trim());
  if (isNaN(n)) return val;
  return (n < 1 ? (n*100).toFixed(1) : n.toFixed(1)) + '%';
}

function volMsg(availQty, reqQty) {
  var a = parseFloat(availQty);
  if (isNaN(a)) return 'N/A';
  if (!reqQty || reqQty === '') return a + ' tons available';
  var r = parseFloat(reqQty);
  if (isNaN(r)) return a + ' tons available';
  if (a >= r) return r + ' of ' + r + ' tons available (full request fulfilled)';
  return a + ' of ' + r + ' tons requested available';
}

function cleanRec(text) {
  try { var p = JSON.parse(text); if (Array.isArray(p)) return p.map(function(b){return b.text||'';}).join('').replace(/#{1,3}\s*/g,'').replace(/\*\*/g,'').trim(); } catch(e) {}
  return text.replace(/#{1,3}\s*/g,'').replace(/\*\*/g,'').trim();
}

function scoreClass(s) { var n=parseInt(s); return n>=15?'high':n>=8?'mid':'low'; }

function buildCard(match, rank, avail, reqQty) {
  var id = 'mc' + rank + (match.Availability_ID || rank);
  var color = avail ? (avail.Color||'N/A') : 'N/A';
  var contam = avail ? fmtContam(avail.Contamination_Degree) : 'N/A';
  var loc = avail ? [avail.Location_City, avail.Location_Country].filter(Boolean).join(', ')||'N/A' : 'N/A';
  var adate = avail ? (avail.Available_Date||'N/A') : 'N/A';
  var price = avail ? (avail['Price_Per_Ton (eur)']||'N/A') : 'N/A';
  if (price !== 'N/A' && price !== 'On request' && !isNaN(parseFloat(price))) price = parseFloat(price).toFixed(0) + ' EUR/ton';
  var vol = avail ? volMsg(avail.Quantity_Tons, reqQty) : 'N/A';
  var form = avail ? (avail.Material_Form||'N/A') : 'N/A';

  var card = document.createElement('div');
  card.className = 'match-card';

  var top = document.createElement('div');
  top.className = 'match-card-top';
  top.innerHTML =
    '<div class="rank">'+rank+'</div>' +
    '<div><div class="match-supplier">'+(match.Supplier_Name||'')+'</div>' +
    '<div class="match-meta"><span>'+(match.Material_Type_Needed||'')+'</span>' +
    '<span>'+color+' &middot; '+contam+' contamination</span>' +
    '<span>'+loc+'</span>' +
    '<span>Match ID: '+(match.Match_ID||'')+'</span></div></div>' +
    '<div><div class="score-number '+scoreClass(match.Match_Score)+'">'+match.Match_Score+'</div>' +
    '<div class="score-lbl">score</div></div>';
  card.appendChild(top);

  var footer = document.createElement('div');
  footer.className = 'card-footer';

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'more-btn';
  btn.id = 'mbtn-'+id;
  btn.textContent = 'More information \u25be';

  var panel = document.createElement('div');
  panel.className = 'expand-panel';
  panel.id = 'mpanel-'+id;
  panel.innerHTML =
    '<div class="expand-grid">' +
    '<div class="expand-tile"><div class="expand-tile-label">Available date</div><div class="expand-tile-value">'+adate+'</div></div>' +
    '<div class="expand-tile"><div class="expand-tile-label">Price per ton</div><div class="expand-tile-value">'+price+'</div></div>' +
    '<div class="expand-tile"><div class="expand-tile-label">Volume</div><div class="expand-tile-value">'+vol+'</div></div>' +
    '<div class="expand-tile"><div class="expand-tile-label">Material form</div><div class="expand-tile-value">'+form+'</div></div>' +
    '</div>';

  btn.addEventListener('click', function() {
    var open = panel.classList.toggle('open');
    btn.classList.toggle('open', open);
    btn.textContent = open ? 'Less information \u25b4' : 'More information \u25be';
  });

  footer.appendChild(btn);
  footer.appendChild(panel);
  card.appendChild(footer);
  return card;
}

async function searchMatches(submittedDate) {
  var company = document.getElementById('companyInput').value.trim();
  if (!company) return;

  var area = document.getElementById('results-area');
  area.className = 'results-area visible';
  area.innerHTML = '<div class="state-msg"><div class="spinner"></div><p>Finding matches...</p></div>';

  try {
    var allData = await Promise.all([
      fetchSheet('Material Matches'),
      fetchSheet('Match Recommendation AI'),
      fetchSheet('Material_Availability'),
      fetchSheet('Customer_Requests')
    ]);
    var matches=allData[0], recs=allData[1], availability=allData[2], customerRequests=allData[3];

    var lc = company.toLowerCase();
    var filtered = matches.filter(function(r){return r.Customer_Name&&r.Customer_Name.toLowerCase().indexOf(lc)!==-1;})
      .sort(function(a,b){return parseInt(b.Match_Score)-parseInt(a.Match_Score);});

    var rec = null;
    for (var i=0;i<recs.length;i++){if(recs[i].Customer_Name&&recs[i].Customer_Name.toLowerCase().indexOf(lc)!==-1){rec=recs[i];break;}}

    if (filtered.length===0){
      var exists=customerRequests.some(function(r){return r.Customer_Name&&r.Customer_Name.toLowerCase().indexOf(lc)!==-1;});
      area.innerHTML = exists
        ? '<div class="state-msg"><p>We are still looking for matches for <strong>'+company+'</strong>.<br>Please check back in a moment.</p></div>'
        : '<div class="state-msg"><p>Company not found: <strong>'+company+'</strong>.<br>Please check the spelling and try again.</p></div>';
      return;
    }

    var customerReq=null;
    for (var ci=0;ci<customerRequests.length;ci++){if(customerRequests[ci].Customer_Name&&customerRequests[ci].Customer_Name.toLowerCase().indexOf(lc)!==-1){customerReq=customerRequests[ci];break;}}
    var reqQty = customerReq ? customerReq.Quantity_Tons : '';

    var availMap={};
    availability.forEach(function(a){if(a.Availability_ID)availMap[a.Availability_ID]=a;});

    area.innerHTML='';

    var heading=document.createElement('div');
    heading.className='company-heading';
    heading.innerHTML='<div class="label">Results for</div><h2>'+filtered[0].Customer_Name+'</h2>'+(submittedDate?'<div class="submitted-date">Request submitted on '+submittedDate+'</div>':'');
    area.appendChild(heading);

    if (rec&&rec.AI_Reasoning){
      var clean=cleanRec(rec.AI_Reasoning);
      var summary=clean.length>500?clean.substring(0,500)+'...':clean;
      var recDiv=document.createElement('div');
      recDiv.className='recommendation';
      recDiv.innerHTML='<div class="rec-tag">AI Procurement Recommendation</div><div class="rec-text">'+summary+'</div>';
      area.appendChild(recDiv);
    }

    var lbl=document.createElement('div');
    lbl.className='matches-label';
    lbl.textContent='Top matches \u2014 sorted by score';
    area.appendChild(lbl);

    filtered.slice(0,3).forEach(function(m,i){area.appendChild(buildCard(m,i+1,availMap[m.Availability_ID]||null,reqQty));});

    var rest=filtered.slice(3);
    if (rest.length>0){
      var hidden=document.createElement('div');
      hidden.className='hidden-cards'; hidden.id='hiddenCards';
      rest.forEach(function(m,i){hidden.appendChild(buildCard(m,i+4,availMap[m.Availability_ID]||null,reqQty));});
      area.appendChild(hidden);
      var moreRow=document.createElement('div'); moreRow.className='show-more-row';
      var moreBtn=document.createElement('button'); moreBtn.type='button'; moreBtn.className='show-more-btn';
      moreBtn.textContent='Show '+rest.length+' more match'+(rest.length>1?'es':'');
      moreBtn.addEventListener('click',function(){hidden.style.display='block';moreRow.style.display='none';});
      moreRow.appendChild(moreBtn); area.appendChild(moreRow);
    }
  } catch(err) {
    area.innerHTML='<div class="state-msg"><p>Could not load data.<br><small>'+err.message+'</small></p></div>';
  }
}
</script>
</body>
</html>
